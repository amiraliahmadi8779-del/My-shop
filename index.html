<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>amirali shopن</title>

<style>
body{
  margin:0;
  font-family:tahoma;
  background:#f2f2f2;
  direction:rtl;
}

header{
  background:#ef394e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#search{
  width:90%;
  margin:15px auto;
  display:block;
  padding:10px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:15px;
  padding:15px;
}

.product{
  background:white;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.product img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

.product button{
  background:#ef394e;
  color:white;
  border:none;
  padding:8px;
  width:100%;
  border-radius:6px;
  cursor:pointer;
}

.cart{
  background:white;
  margin:20px;
  padding:15px;
  border-radius:10px;
}

#whatsapp{
  background:#25d366;
  color:white;
  display:block;
  text-align:center;
  padding:12px;
  text-decoration:none;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h2>🛒 فروشگاه خفن</h2>
  <div id="cart-count">سبد خرید: 0</div>
</header>

<input id="search" placeholder="جستجوی محصول...">

<div class="products" id="products"></div>

<div class="cart">
  <h3>سبد خرید</h3>
  <ul id="cart-items"></ul>
  <strong>جمع کل: <span id="total">0</span> تومان</strong>
  <a id="whatsapp" target="_blank">ثبت سفارش در واتساپ</a>
</div>

<script>

];

const productsDiv = document.getElementById("products");
const cartItems = document.getElementById("cart-items");
const totalSpan = document.getElementById("total");
const cartCount = document.getElementById("cart-count");
const search = document.getElementById("search");

let cart = [];

function render(list){
  productsDiv.innerHTML="";
  list.forEach(p=>{
    productsDiv.innerHTML+=`
      <div class="product">
        <img src="https://picsum.photos/300?random=${p.id}">
        <h4>${p.name}</h4>
        <p>${p.price.toLocaleString()} تومان</p>
        <button onclick="add(${p.id})">افزودن</button>
      </div>
    `;
  });
}

function add(id){
  cart.push(products.find(p=>p.id===id));
  update();
}

function update(){
  cartItems.innerHTML="";
  let total=0;
  cart.forEach(p=>{
    total+=p.price;
    cartItems.innerHTML+=`<li>${p.name} - ${p.price.toLocaleString()}</li>`;
  });
  totalSpan.innerText=total.toLocaleString();
  cartCount.innerText="سبد خرید: "+cart.length;

  let text=cart.map(p=>p.name+" - "+p.price).join("%0A");
  document.getElementById("whatsapp").href=
  "https://wa.me/+930796552252?text=سفارش:%0A"+text+"%0Aجمع:"+total;
}

search.addEventListener("input",()=>{
  render(products.filter(p=>p.name.includes(search.value)));
});

render(products);
</script>

</body>
</html>
